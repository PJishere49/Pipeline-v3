name: SMB Audit Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Discovery Search
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: node search.js

      - name: Commit Prospects and Usage to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prospects.json usage.json
          git commit -m "Auto-discovered prospects and updated API usage" || echo "No changes to commit"
          git push
