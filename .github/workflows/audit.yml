name: SMB Audit Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run Discovery Search
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: node search.js

      - name: Find Businesses with No Website
        run: node maps.js

      - name: Run Crawler and Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node crawler.js

      - name: Generate Pitch Briefs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node llm.js

      - name: Commit Results to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prospects.json usage.json scored_results.json review_manually.json gold_mine.json
          git commit -m "Auto-discovered prospects and scored results" || echo "No changes to commit"
          git push
